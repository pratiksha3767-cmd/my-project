<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password - Mini Fresh Basket</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body class="auth-page"><main class="auth-card reset-card"><div class="reset-badge">✦ Secure Reset</div><img src="/static/images/logo.png" class="auth-logo" alt="Mini Fresh Basket"><h2>Forgot Password?</h2><p>Get a one-time code in your email and choose a new password.</p>
<form id="forgotForm"><label class="field-label" for="resetEmail">Email address</label><input id="resetEmail" type="email" placeholder="you@example.com" autocomplete="email" required><button class="btn full" type="submit">Send OTP to Email</button></form>
<form id="resetConfirmForm" class="reset-confirm"><label class="field-label" for="resetOtp">6-digit OTP</label><input id="resetOtp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="Enter OTP from email" required><label class="field-label" for="newPassword">New password</label><div class="password-field"><input id="newPassword" type="password" minlength="8" placeholder="8+ chars, uppercase, lowercase, number" autocomplete="new-password" required><button class="password-toggle" type="button" data-password-target="newPassword" aria-label="Show password" aria-pressed="false"><span class="toggle-icon" aria-hidden="true">◎</span><span class="toggle-label">Show</span></button></div><label class="field-label" for="confirmNewPassword">Confirm new password</label><div class="password-field"><input id="confirmNewPassword" type="password" minlength="8" placeholder="Repeat new password" autocomplete="new-password" required><button class="password-toggle" type="button" data-password-target="confirmNewPassword" aria-label="Show password" aria-pressed="false"><span class="toggle-icon" aria-hidden="true">◎</span><span class="toggle-label">Show</span></button></div><button class="btn full" type="submit">Verify OTP & Reset Password</button></form>
<p id="message" class="message" role="status" aria-live="polite"></p><p><a href="/login">← Back to Login</a></p><p class="muted">OTP expires after 10 minutes. Never share it with anyone.</p></main><script src="/static/js/auth.js"></script></body></html>
